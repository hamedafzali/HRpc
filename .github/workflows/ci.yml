name: CI

on:
  push:
    branches: ["**"] # every branch, so pushing a feature/stabilization branch runs CI, not just main
  pull_request:
    branches: [main]
  workflow_call: {} # allows publish.yml to reuse this exact build+test matrix before publishing

env:
  # Fail the build on any compiler warning, not just errors.
  BUILD_ARGS: -c Release /p:TreatWarningsAsErrors=true /warnaserror

jobs:
  # net48 is .NET Framework, which only runs on Windows -- this leg cannot run on
  # ubuntu-latest/macos-latest no matter how the workflow is written. It is also the ONLY
  # leg that requires Windows: net8.0+ runs fine (build and test) on any OS, so those legs
  # run on Linux and macOS below.
  test-net48-windows:
    name: Build & Test (net48, windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x" # the solution targets net10.0, so restore needs the 10 SDK

      - name: Restore
        run: dotnet restore HRpc.sln

      - name: Build (net48)
        run: dotnet build HRpc.sln -f net48 ${{ env.BUILD_ARGS }} --no-restore

      - name: Test (net48 -- Newtonsoft.Json serializer path)
        run: dotnet test Tests/HRpc.Tests.csproj -f net48 -c Release --no-build --logger "console;verbosity=normal"

  # Linux and macOS: on Unix, .NET named pipes are Unix domain sockets under /tmp, and
  # macOS has the shortest socket-path limit, so both OSes are tested, not just Linux.
  test-unix:
    name: Build & Test (${{ matrix.tfm }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tfm: [net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore HRpc.sln

      - name: Build (${{ matrix.tfm }})
        run: dotnet build HRpc.sln -f ${{ matrix.tfm }} ${{ env.BUILD_ARGS }} --no-restore

      - name: Test (${{ matrix.tfm }} -- System.Text.Json serializer path)
        run: dotnet test Tests/HRpc.Tests.csproj -f ${{ matrix.tfm }} -c Release --no-build --logger "console;verbosity=normal"
